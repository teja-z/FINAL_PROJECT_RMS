<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Login - RMS SVNIT</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    body {
      font-family: sans-serif;
      background-color: #f5f5f5;
      margin: 0;
      padding: 0;
    }

    .navbar {
      background-color: #91fff8;
      padding: 1rem 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 1.5rem;
      font-weight: bold;
      color: #333;
    }

    .login-container {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 80vh;
    }

    .login-box {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      box-shadow: 0 0 12px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .login-box h2 {
      margin-bottom: 1rem;
    }

    .login-box input {
      width: 90%;
      padding: 0.7rem;
      margin-bottom: 1rem;
      border-radius: 6px;
      border: 1px solid #ccc;
    }

    .login-box button {
      padding: 0.6rem 2rem;
      border: none;
      background-color: #00c853;
      color: white;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
    }

    .login-box button:hover {
      background-color: #00b44c;
    }

    .login-message {
      margin-top: 1rem;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <header class="navbar">
    <div class="logo">RMS SVNIT</div>
    <a href="{% url 'index' %}" style="text-decoration: none; font-weight: bold;">← Back to Home</a>
  </header>

  <div class="login-container">
    <div class="login-box">
      <h2>Login with SVNIT Email</h2>
      <input type="email" id="emailInput" placeholder="Enter your email" required />
      <button onclick="handleLogin()">Login</button>
      <p class="login-message" id="loginMessage"></p>
    </div>
  </div>

  <script>
    function handleLogin() {
      const email = document.getElementById("emailInput").value.trim();
      const msg = document.getElementById("loginMessage");
  
      if (email.endsWith("@svnit.ac.in")) {
        localStorage.setItem("isLoggedIn", "true");

        msg.textContent = "Login successful!";
        setTimeout(() => {
          window.location.href = "{% url 'index' %}";
        }, 1500);
      } else {
        msg.style.color = "red";
        msg.textContent = "Enter Valid Id !!";
      }
    }
  </script>

</body>
</html>
